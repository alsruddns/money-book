name: CI

on:
  push:
    branches:
      - feature/dev
      - develop
      - release
      - main
  pull_request:
    branches:
      - feature/dev
      - develop
      - release
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21 and Gradle cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Run Backend tests and build
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

  frontend:
    name: Frontend test, lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Set up pnpm 9.12.1 and pnpm store cache
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.1
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: pnpm test

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          BACKEND_API_URL: http://localhost:8080
          SITE_URL: https://example.invalid
        run: pnpm build

  docker:
    name: Docker image and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Deliberately disposable CI-only values; no production credentials are used.
      POSTGRES_DB: moneybook_ci
      POSTGRES_USER: moneybook_ci
      POSTGRES_PASSWORD: ci-only-password-not-for-deployment
      DB_URL: jdbc:postgresql://postgres:5432/moneybook_ci
      DB_USERNAME: moneybook_ci
      DB_PASSWORD: ci-only-password-not-for-deployment
      JWT_SECRET: ci-only-secret-never-use-outside-tests-0123456789
      SITE_DOMAIN: ':80'
      SITE_URL: https://example.invalid
      BACKEND_API_URL: http://backend:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose configuration
        run: docker compose -f compose.prod.yml config --quiet

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            --env SITE_DOMAIN=':80' \
            --volume "$GITHUB_WORKSPACE/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build Backend image without publishing
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: moneybook-backend:ci
          load: true
          push: false
          cache-from: |
            type=gha,scope=backend-main
            type=gha,scope=backend-${{ github.event.pull_request.number || github.ref_name }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=backend-{0}', github.ref_name) || '' }}

      - name: Build Frontend image without publishing
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: moneybook-frontend:ci
          load: true
          push: false
          build-args: |
            BACKEND_API_URL=http://backend:8080
            SITE_URL=https://example.invalid
          cache-from: |
            type=gha,scope=frontend-main
            type=gha,scope=frontend-${{ github.event.pull_request.number || github.ref_name }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=frontend-{0}', github.ref_name) || '' }}
