name: Production Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: money-book-production-deploy
  cancel-in-progress: false

jobs:
  changes:
    name: Detect deployment targets
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git ls-tree -r --name-only "$AFTER")"
          else
            changed_files="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi

          frontend=false
          backend=false
          while IFS= read -r file; do
            case "$file" in
              frontend/*)
                frontend=true
                ;;
              backend/*)
                backend=true
                ;;
              compose.prod.yml|docker-compose.yml|.github/workflows/*|Dockerfile|.dockerignore)
                frontend=true
                backend=true
                ;;
            esac
          done <<< "$changed_files"

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build and deploy frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            BACKEND_API_URL=http://backend:8080
            NEXT_PUBLIC_GA_ID=G-ZJSJW06SCX
            SITE_URL=https://www.woori.today
            GOOGLE_SITE_VERIFICATION=${{ vars.GOOGLE_SITE_VERIFICATION }}
            NAVER_SITE_VERIFICATION=${{ vars.NAVER_SITE_VERIFICATION }}
          tags: |
            ghcr.io/alsruddns/money-book-frontend:latest
            ghcr.io/alsruddns/money-book-frontend:${{ github.sha }}

      - name: Deploy frontend on production server
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVICE: moneybook-frontend
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVICE
          script: |
            set -eu
            cd /opt/services/compose
            docker compose --env-file .env.moneybook pull "$SERVICE"
            docker compose --env-file .env.moneybook up -d "$SERVICE"
            container_id="$(docker compose --env-file .env.moneybook ps -q "$SERVICE")"
            if [ -z "$container_id" ]; then
              echo "Service $SERVICE has no container after deployment" >&2
              exit 1
            fi
            attempt=0
            until [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container_id")" = healthy ]; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 60 ]; then
                echo "Service $SERVICE did not become healthy" >&2
                docker inspect --format '{{json .State}}' "$container_id" >&2
                exit 1
              fi
              sleep 5
            done

  backend:
    name: Build and deploy backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/alsruddns/money-book-backend:latest
            ghcr.io/alsruddns/money-book-backend:${{ github.sha }}

      - name: Deploy backend on production server
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVICE: moneybook-backend
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVICE
          script: |
            set -eu
            cd /opt/services/compose
            docker compose --env-file .env.moneybook up -d postgres
            postgres_id="$(docker compose --env-file .env.moneybook ps -q postgres)"
            if [ -z "$postgres_id" ]; then
              echo "Postgres has no container after startup" >&2
              exit 1
            fi
            attempt=0
            until [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$postgres_id")" = healthy ]; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 60 ]; then
                echo "Postgres did not become healthy" >&2
                docker inspect --format '{{json .State}}' "$postgres_id" >&2
                exit 1
              fi
              sleep 5
            done
            docker compose --env-file .env.moneybook pull "$SERVICE"
            docker compose --env-file .env.moneybook up -d "$SERVICE"
            container_id="$(docker compose --env-file .env.moneybook ps -q "$SERVICE")"
            if [ -z "$container_id" ]; then
              echo "Service $SERVICE has no container after deployment" >&2
              exit 1
            fi
            attempt=0
            until [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container_id")" = healthy ]; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 60 ]; then
                echo "Service $SERVICE did not become healthy" >&2
                docker inspect --format '{{json .State}}' "$container_id" >&2
                exit 1
              fi
              sleep 5
            done
