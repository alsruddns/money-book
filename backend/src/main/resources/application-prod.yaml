spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,diskSpace
  info:
    env:
      enabled: true
info:
  app:
    name: MoneyBook
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
server:
  shutdown: graceful
  # The Backend is reachable only from Caddy on the private proxy network.
  # Caddy overwrites forwarded headers from the client connection before proxying.
  forward-headers-strategy: framework
